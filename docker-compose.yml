# SENTINEL Ultimate Security Fabric - Full Stack Deployment
# Services:
#   - sentinel: Policy API gateway (Layers 1,3-7)
#   - suricata: Network IDS/IPS (Layer 2)
#   - suricata-forwarder: EVE -> Sentinel events bridge
#   - redis: Session/token cache for Layer 3
#   - nginx: TLS 1.3 termination (Layer 1 edge)
#   - prometheus: Metrics collection
#   - grafana: Dashboards (optional)

services:
  # ---------------------------------------------------------
  # SENTINEL API - Core policy gateway
  # ---------------------------------------------------------
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /app/tmp:size=100M,mode=1777
    volumes:
      - sentinel-data:/app/data
      - sentinel-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - SENTINEL_HOST=0.0.0.0
      - SENTINEL_PORT=8080
      - SENTINEL_MAX_BODY_BYTES=1048576
      - SENTINEL_RATE_LIMIT=120
      - SENTINEL_TRUST_PROXY=true
      # Master key must be set via secret in production
      - SENTINEL_MASTER_KEY=${SENTINEL_MASTER_KEY}
      - SENTINEL_EVENT_STORE=/app/data/sentinel-events.enc
      # Identity/OIDC config
      - SENTINEL_OIDC_ISSUER=${SENTINEL_OIDC_ISSUER:-https://identity.example.invalid/realms/sentinel}
      - SENTINEL_OIDC_AUDIENCE=${SENTINEL_OIDC_AUDIENCE:-sentinel-api}
      - SENTINEL_OIDC_JWKS_URL=${SENTINEL_OIDC_JWKS_URL}
      # Redis for session cache
      - REDIS_URL=redis://redis:6379/0
    networks:
      - sentinel-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------
  # SURICATA IDS/IPS - Layer 2 Network Fortress
  # ---------------------------------------------------------
  suricata:
    image: jasonish/suricata:latest
    container_name: sentinel-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    # Run in AF_PACKET mode on host network for traffic visibility
    # Or NFQUEUE mode for inline IPS (requires host nftables rules)
    network_mode: host
    command: >
      -i eth0
      -c /etc/suricata/suricata.yaml
      -S /etc/suricata/rules
      --set default.rule_path=/etc/suricata/rules
    volumes:
      - ./layer2/suricata/suricata.yaml.example:/etc/suricata/suricata.yaml:ro
      - ./layer2/suricata/rules:/etc/suricata/rules:ro
      - suricata-logs:/var/log/suricata
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    profiles:
      - ids

  # ---------------------------------------------------------
  # SURICATA FORWARDER - EVE JSON -> Sentinel Events
  # ---------------------------------------------------------
  suricata-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
    container_name: sentinel-suricata-forwarder
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    volumes:
      - suricata-logs:/var/log/suricata:ro
    environment:
      - SENTINEL_EVE=/var/log/suricata/eve.json
      - SENTINEL_EVENTS_URL=http://sentinel:8080/v1/events
      - SENTINEL_EVENTS_TOKEN=${SENTINEL_EVENTS_TOKEN}
    networks:
      - sentinel-internal
    depends_on:
      - sentinel
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    profiles:
      - ids

  # ---------------------------------------------------------
  # REDIS - Session/Token Cache for Layer 3
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    user: "999:999"
    read_only: true
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - sentinel-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------
  # NGINX - TLS 1.3 Edge Termination (Layer 1)
  # ---------------------------------------------------------
  nginx:
    profiles:
      - edge
    image: nginx:alpine
    container_name: sentinel-nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=50M,mode=1777
      - /var/run:size=10M,mode=1777
      - /tmp:size=10M,mode=1777
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/ssl/sentinel:ro
      - nginx-logs:/var/log/nginx
    networks:
      - sentinel-internal
      - sentinel-external
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - sentinel
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ---------------------------------------------------------
  # PROMETHEUS - Metrics Collection
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /prometheus
      - /tmp
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sentinel-internal
      - sentinel-monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    profiles:
      - monitoring

  # ---------------------------------------------------------
  # GRAFANA - Dashboards (Optional)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    user: "472:472"
    read_only: true
    tmpfs:
      - /var/lib/grafana
      - /tmp
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    networks:
      - sentinel-monitoring
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    profiles:
      - monitoring

networks:
  sentinel-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
  sentinel-external:
    driver: bridge
    internal: false
  sentinel-monitoring:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  sentinel-data:
    driver: local
  sentinel-logs:
    driver: local
  suricata-logs:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local