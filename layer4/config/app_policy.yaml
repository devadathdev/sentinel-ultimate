version: 1
name: SENTINEL Layer 4 Application Fortress Policy

waf:
  enabled: true
  max_body_bytes: 1048576       # 1 MiB default body limit
  block_probes: true
  enforce_strict_methods: true
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - HEAD
    - OPTIONS
  allowed_content_types:
    - application/json
    - text/plain
    - multipart/form-data

rate_limits:
  window_seconds: 60
  penalty_duration_seconds: 300
  zones:
    user: 120
    ai: 300
    server: 1200
    iot: 30
    management: 60

sensitive_routes:
  - path: /v1/identity/revoke
    required_role: admin
    rate_limit: 10
  - path: /v1/crypto/rotate
    required_role: admin
    rate_limit: 5
